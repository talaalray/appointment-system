networks:
  internal-net:
    driver: bridge

volumes:
  mysqldata:
    driver: local
  nginx-logs:
    driver: local
  crowdsec-db:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    networks:
      - internal-net
    volumes:
      - mysqldata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: appointmentdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    image: talaalray/appointment-app:latest
    container_name: appointment-app
    restart: unless-stopped
    networks:
      - internal-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/appointmentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_ACCESSEXPMIN: 60
      SERVER_SSL_ENABLED: "false"
      SERVER_PORT: "8080"
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec-security
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/nginx crowdsecurity/http-dos"
      GID: "1000"
      UID: "1000"
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_ADDR: "0.0.0.0:6060"
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - nginx-logs:/var/log/nginx:ro
    security_opt:
      - no-new-privileges:true

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}

  crowdsec-webui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    container_name: crowdsec-web-ui
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "8081:3000"
    environment:
      HOST: 0.0.0.0
      CROWDSEC_URL: http://crowdsec-security:8080
      CROWDSEC_USER: web-ui
      CROWDSEC_PASSWORD: "password123"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - crowdsec

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    networks:
      - internal-net
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
