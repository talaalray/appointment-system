<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>تسجيل الدخول</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container"><div class="row justify-content-center mt-5"><div class="col-md-4"><div class="card shadow"><div class="card-header bg-primary text-white text-center"><h4>🔐 تسجيل الدخول</h4></div><div class="card-body"><form th:action="@{/web/login}" method="post"><div class="mb-3"><label for="username" class="form-label">اسم المستخدم</label><input type="text" class="form-control" id="username" name="username" required></div><div class="mb-3"><label for="password" class="form-label">كلمة المرور</label><input type="password" class="form-control" id="password" name="password" required></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><button type="submit" class="btn btn-primary w-100">تسجيل الدخول</button></form><div class="mt-3 text-center"><small>👤 admin/1234 | customer/1234 | staff/1234</small></div></div></div></div></div></div>
</body>
</html>
