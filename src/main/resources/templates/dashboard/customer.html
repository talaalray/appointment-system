<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>داشبورد العميل</title></head><body><div th:fragment="content"><h1 class="mb-4">👋 مرحباً، <span th:text="${user.username}"></span></h1><div class="row"><div class="col-md-4"><div class="card text-white bg-success mb-3"><div class="card-body"><h5 class="card-title"><i class="fas fa-plus-circle"></i> حجز موعد</h5><p class="card-text">احجز موعداً جديداً</p><a href="/book" class="btn btn-light">حجز الآن</a></div></div></div><div class="col-md-4"><div class="card text-white bg-info mb-3"><div class="card-body"><h5 class="card-title"><i class="fas fa-calendar-alt"></i> المواعيد القادمة</h5><p class="card-text">لديك <span th:text="${upcomingCount}">0</span> موعداً قادماً</p><a href="/appointments" class="btn btn-light">عرض الكل</a></div></div></div></div><h3 class="mt-4">📋 مواعيدي</h3><table class="table table-striped"><thead><tr><th>الخدمة</th><th>التاريخ والوقت</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody><tr th:each="app : ${appointments}"><td th:text="${app.service.name}"></td><td th:text="${app.startDateTime}"></td><td><span class="badge" th:class="${app.status == 'PENDING' ? 'bg-warning' : app.status == 'APPROVED' ? 'bg-success' : 'bg-danger'}" th:text="${app.status}"></span></td><td><a th:if="${app.status == 'PENDING'}" th:href="@{/appointments/{id}/cancel(id=${app.id})}" class="btn btn-sm btn-danger">إلغاء</a></td></tr></tbody></table></div></body>
</html>
