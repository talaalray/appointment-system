name: CI/CD Pipeline (3 Stages)

on:
  push:
    branches: [ main ]

env:
  WORKDIR: /home/project2/runner-workdir
  MAVEN_OPTS: -Dmaven.repo.local=/home/project2/.m2/repository

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: تجهيز مستودع العمل (clone أو reset)
        run: |
          if [ -d "$WORKDIR/.git" ]; then
            cd $WORKDIR
            git fetch origin
            git reset --hard origin/main
          else
            git clone https://${{ github.token }}@github.com/${{ github.repository }}.git $WORKDIR
          fi

      - name: بناء الحزمة (بدون اختبارات)
        working-directory: ${{ env.WORKDIR }}
        run: mvn clean package -DskipTests -B

  test:
    needs: build
    runs-on: self-hosted
    steps:
      - name: التأكد من وجود الكود وتحديثه
        run: |
          if [ -d "$WORKDIR/.git" ]; then
            cd $WORKDIR
            git fetch origin
            git reset --hard origin/main
          else
            git clone https://${{ github.token }}@github.com/${{ github.repository }}.git $WORKDIR
          fi

      - name: تشغيل حاوية MySQL للاختبارات
        run: |
          docker run -d --name mysql-test \
            -e MYSQL_ROOT_PASSWORD=testroot \
            -e MYSQL_DATABASE=testdb \
            -p 3306:3306 mysql:8.0
          echo "انتظار حتى يصبح MySQL جاهزاً..."
          for i in $(seq 1 30); do
            if docker exec mysql-test mysqladmin ping -h localhost --silent; then
              echo "MySQL جاهز."
              break
            fi
            sleep 2
          done

      - name: تشغيل الاختبارات
        working-directory: ${{ env.WORKDIR }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testroot
          APP_JWT_SECRET: MyTestSecretKeyForCI@2026!SecureX
        run: mvn test -B

      - name: إيقاف وإزالة حاوية MySQL
        if: always()
        run: docker rm -f mysql-test

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: التأكد من وجود الكود وتحديثه
        run: |
          if [ -d "$WORKDIR/.git" ]; then
            cd $WORKDIR
            git fetch origin
            git reset --hard origin/main
          else
            git clone https://${{ github.token }}@github.com/${{ github.repository }}.git $WORKDIR
          fi

      - name: بناء صورة Docker
        working-directory: ${{ env.WORKDIR }}
        run: docker build -t talaalray/appointment-app:latest .

      - name: رفع الصورة إلى Docker Hub
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push talaalray/appointment-app:latest

      - name: نشر التطبيق على الخادم
        run: |
          cd ~/appointment-system
          docker compose pull app
          docker compose up -d --no-deps app
